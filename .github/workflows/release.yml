name: release

# Manual trigger → build wheel + sdist → upload to PyPI.
# Per Plan § Week 4 step 3.5: manual release (no auto-publish).
# Trigger: GitHub Actions → "Run workflow" → specify version tag.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. v1.17.91) -- the tag must already exist'
        required: true
        # v1.17.86: this default was v1.17.26, frozen since Week 4 of the
        # plan. A stale default is worse than no default: the workflow
        # runs, compares the input against pyproject.toml, and fails
        # with a version mismatch that names the OLD version -- which
        # reads like "the release is broken" rather than "the default
        # was never updated". test_release_workflow_security.py keeps
        # this default equal to pyproject.toml's version, so it cannot
        # go stale again.
        default: 'v1.17.91'
      pypi:
        description: 'Upload to PyPI?'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: read
  id-token: write  # for PyPI trusted publishing (OIDC)

jobs:
  build:
    name: Build wheel + sdist
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        # 固定到 commit SHA：tag 可被重指向，SHA 不可变（记录原版本 v4）
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # v1.17.85: this checked out the DEFAULT BRANCH, not the tag.
          # The workflow names a version to release, then verifies that
          # version against pyproject.toml -- but pyproject came from
          # main, not from the tag. So "release v1.17.40" would build
          # whatever happened to be on main, and the check would compare
          # main's version against the tag's name. It fails, but it
          # fails for the wrong reason, and it can never succeed for
          # any tag that is not also main's HEAD.
          #
          # The tag is the thing being released, so the tag is what has
          # to be checked out. The version input is passed through env
          # and quoted: an untrusted workflow_dispatch input must not
          # be interpolated into a run block (it would be read as
          # shell code).
          ref: ${{ github.event.inputs.version }}
          fetch-depth: 0

      - name: Setup Python 3.12
        # 固定到 commit SHA（记录原版本 v5）
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build hatch

      - name: Run tests first (gate release)
        run: |
          pip install -e ".[dev]"
          pytest tests/ -v --tb=short

      - name: Verify the release tag exists and matches the version
        # 不可信的 workflow_dispatch 输入不能直接插值进 run 块（会被当成 shell 代码执行），
        # 必须经 env 传入并在 shell 内加引号引用。
        env:
          VERSION_INPUT: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          EXPECTED="$VERSION_INPUT"
          if ! git rev-parse -q --verify "refs/tags/$EXPECTED" >/dev/null; then
            echo "::error::Tag '$EXPECTED' does not exist in this repository."
            echo "::error::Create it first: git tag -a '$EXPECTED' -m 'release $EXPECTED' && git push origin '$EXPECTED'"
            echo "::error::Tags on the remote: $(git ls-remote --tags origin | sed 's#.*refs/tags/##;s/\^{}//' | sort -uV | tr '\n' ' ')"
            exit 1
          fi
          echo "tag '$EXPECTED' exists at $(git rev-list -n1 "$EXPECTED" | cut -c1-8)"
          VERSION=$(grep '^version' pyproject.toml | head -1 | cut -d'"' -f2)
          echo "pyproject version: $VERSION"
          EXPECTED_STRIP="${EXPECTED#v}"
          if [ "$VERSION" != "$EXPECTED_STRIP" ]; then
            echo "::error::Version mismatch: the tag '$EXPECTED' carries version '$EXPECTED_STRIP' but pyproject.toml says '$VERSION'"
            exit 1
          fi
          echo "Version match OK"

      - name: Build wheel + sdist
        run: |
          python -m build

      - name: Upload artifacts
        # 固定到 commit SHA（记录原版本 v4）
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ github.event.inputs.version }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish to PyPI
    needs: build
    if: github.event.inputs.pypi == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/astor-memory
    steps:
      - name: Download artifacts
        # 固定到 commit SHA（记录原版本 v4）
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-${{ github.event.inputs.version }}
          path: dist/

      - name: Publish to PyPI via OIDC
        # 这个 job 持有 id-token: write（OIDC 发布凭据），所以 action 必须是不可变的 commit SHA：
        # 可变 tag（release/v1）可被上游重新指向，等于把 PyPI 发布权限交给任意第三方代码。
        # SHA 7245906f... = release/v1 分支当前指向的提交，同时是 v1.14.3 的 tag 目标。
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1 (v1.14.3)
        with:
          packages-dir: dist/
          # OIDC trusted publishing — no API token needed.
          # Set up at: https://pypi.org/manage/account/publishing/
