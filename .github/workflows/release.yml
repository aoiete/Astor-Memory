name: release

# Manual trigger → build wheel + sdist → upload to PyPI.
# Per Plan § Week 4 step 3.5: manual release (no auto-publish).
# Trigger: GitHub Actions → "Run workflow" → specify version tag.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. v0.3.0)'
        required: true
        default: 'v0.3.0'
      pypi:
        description: 'Upload to PyPI?'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: read
  id-token: write  # for PyPI trusted publishing (OIDC)

jobs:
  build:
    name: Build wheel + sdist
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build hatch

      - name: Run tests first (gate release)
        run: |
          pip install -e ".[dev]"
          pytest tests/ -v --tb=short

      - name: Verify version in pyproject matches tag
        run: |
          VERSION=$(grep '^version' pyproject.toml | head -1 | cut -d'"' -f2)
          echo "pyproject version: $VERSION"
          EXPECTED="${{ github.event.inputs.version }}"
          EXPECTED_STRIP="${EXPECTED#v}"
          if [ "$VERSION" != "$EXPECTED_STRIP" ]; then
            echo "::error::Version mismatch: pyproject.toml has '$VERSION' but release tag is '$EXPECTED_STRIP'"
            exit 1
          fi
          echo "Version match OK"

      - name: Build wheel + sdist
        run: |
          python -m build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.event.inputs.version }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish to PyPI
    needs: build
    if: github.event.inputs.pypi == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/astor-memory
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-${{ github.event.inputs.version }}
          path: dist/

      - name: Publish to PyPI via OIDC
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          # OIDC trusted publishing — no API token needed.
          # Set up at: https://pypi.org/manage/account/publishing/
