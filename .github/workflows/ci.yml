name: ci

# Auto-test on push to main + PRs.
# Per Plan § Week 4 step 3.4: Ubuntu 24.04 + Python 3.10/3.11/3.12/3.13 matrix.
# Tests: pytest (functional) + import check (smoke).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: pytest (${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}

      - name: Install package + test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Smoke import
        run: |
          python -c "import astor_memory; print('OK', astor_memory.__version__)"

      # 2026-09-02: ServerIntegrationTests + hermes_adapter rely on a live
      # astor server on 127.0.0.1:7803. Start one as a background process
      # before pytest, stop it after. Tests that need the server will fail
      # loudly if the server is missing — better than silent skip.
      - name: Start astor server (background)
        run: |
          mkdir -p /tmp/astor-ci
          export ASTOR_DIR=/tmp/astor-ci
          nohup python -m astor_memory.server --host 127.0.0.1 --port 7803 \
            > /tmp/astor-server.log 2>&1 &
          echo $! > /tmp/astor-server.pid
          # Wait for /v1/health to return 200 (max 30s)
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:7803/v1/health >/dev/null 2>&1; then
              echo "astor server ready after ${i}s"
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:7803/v1/health || (cat /tmp/astor-server.log; exit 1)

      - name: Run pytest
        run: |
          export ASTOR_DIR=/tmp/astor-ci
          pytest tests/ -v --tb=short

      - name: Stop astor server
        if: always()
        run: |
          if [ -f /tmp/astor-server.pid ]; then
            kill "$(cat /tmp/astor-server.pid)" || true
          fi

      - name: Upload pytest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report-${{ matrix.python-version }}
          path: pytest-report.xml
          if-no-files-found: ignore
          retention-days: 7
